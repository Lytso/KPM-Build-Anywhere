name: Build KPM Modules

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout KPM-Build-Anywhere
        uses: actions/checkout@v4

      - name: Checkout KernelPatch (Headers & API)
        uses: actions/checkout@v4
        with:
          repository: 'LyraVoid/KernelPatch'
          path: 'KernelPatch'
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Compile KPM Modules
        run: |
          make clean
          make KP_DIR=KernelPatch NDK_PATH=$ANDROID_NDK_ROOT

      - name: Upload KPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpm-binaries
          path: |
            *.kpm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lytso_spoof.kpm
            hello.kpm
          name: "Release ${{ github.ref_name }}"
          body: |
            ### KPM Modules built by @ItsLytso
            - `lytso_spoof.kpm`: Ring 0 cmdline & verifiedbootstate spoofing module.
            - Built with Android NDK r26b.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
